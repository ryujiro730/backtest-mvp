services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fx
      POSTGRES_PASSWORD: fxpass
      POSTGRES_DB: fxdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [appnet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [appnet]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [appnet]

  api:                               # ← ここも services: の下に入れる
    build:
      context: ..
      dockerfile: ./infra/backend.Dockerfile
    working_dir: /backtest-mvp
    image: infra-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 1 --log-level debug
    environment:
      POSTGRES_URL: postgresql://fx:fxpass@postgres:5432/fxdb
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: us-east-1
      S3_BUCKET_DATA: backtest-data
      S3_PREFIX: "data/"
      S3_BUCKET_STRATEGIES: strategies
      S3_BUCKET_RESULTS: results
      DATASET_HASH_DEFAULT: 676f732694a3c0a1
    ports: ["8000:8000"]
    networks: [appnet]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_started }
      redis: { condition: service_started }
      minio: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    volumes:
      - ..:/backtest-mvp  

  worker:                            # ← これも services: の下
    networks: [appnet]
    build:
      context: ..
      dockerfile: ./infra/backend.Dockerfile
    working_dir: /backtest-mvp
    command: celery -A worker.tasks worker -l info
    environment:
      POSTGRES_URL: postgresql://fx:fxpass@postgres:5432/fxdb
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: us-east-1
      S3_BUCKET_DATA: backtest-data
      S3_PREFIX: "data/"
      S3_BUCKET_STRATEGIES: strategies
      S3_BUCKET_RESULTS: results
      DATASET_HASH_DEFAULT: 676f732694a3c0a1
    depends_on:
        postgres: { condition: service_started }
        redis: { condition: service_started }
        minio: { condition: service_started }
    volumes:
      - ..:/backtest-mvp
      

volumes:
  pg_data:
  minio_data:

networks:
  appnet: {}

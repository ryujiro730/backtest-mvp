version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: fx
      POSTGRES_PASSWORD: fxpass
      POSTGRES_DB: fxdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    # 内部通信だけでOKなら公開しない
    # ports:
    #   - "6379:6379"

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    container_name: backend
    working_dir: /app
    command: bash -lc "export PYTHONPATH=/app && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ..:/app
    environment:
      POSTGRES_URL: postgresql://fx:fxpass@postgres:5432/fxdb
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_REGION: us-east-1
      S3_BUCKET_DATA: backtest-data
      S3_BUCKET_STRATEGIES: strategies
      S3_BUCKET_RESULTS: results
      DATASET_HASH_DEFAULT: 38d09ca9e276c463
      DATASET_DEFAULT_HASH: 38d09ca9e276c463
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    container_name: worker
    working_dir: /app
    command: bash -lc "export PYTHONPATH=/app && celery -A worker.tasks worker --loglevel=info"
    volumes:
      - ..:/app
    environment:
      POSTGRES_URL: postgresql://fx:fxpass@postgres:5432/fxdb
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_REGION: us-east-1
      S3_BUCKET_DATA: backtest-data
      S3_BUCKET_STRATEGIES: strategies
      S3_BUCKET_RESULTS: results
      DATASET_HASH_DEFAULT: 38d09ca9e276c463
      DATASET_DEFAULT_HASH: 38d09ca9e276c463
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  pg_data:
  minio_data:


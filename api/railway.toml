# railway.toml — API service config
# API service: Root Directory = api/

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/Dockerfile.api"

[deploy]
startCommand = "sh -c 'uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1'"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
